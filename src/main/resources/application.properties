spring.datasource.url=jdbc:mysql://localhost:3306/safebite_db?serverTimezone=UTC&connectTimeout=5000&socketTimeout=5000&autoReconnect=true
spring.datasource.username=root
spring.datasource.password=SafeBite2026
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

server.port=8080
server.servlet.context-path=/
server.compression.enabled=true

logging.level.root=WARN
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.web=INFO
logging.level.org.example.safebitebackend=DEBUG

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
